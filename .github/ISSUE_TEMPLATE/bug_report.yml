name: Bug Report
description: Report something that isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill out the details
        below so we can reproduce and fix it.

        **A file that won't import or display right?** Use
        [Data Import / Display Issue](?template=data_import_issue.yml) instead —
        the app can build a diagnostic report for that template automatically
        (Settings → "Report a data issue").

        **Security issue?** Do not file it here — see `SECURITY.md` instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I import a .vbo file, the lap times are all zero...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Import file X
        3. Switch to Pro view
        4. See error
    validations:
      required: true
  - type: dropdown
    id: file-format
    attributes:
      label: File format involved
      description: Parsers are format-specific — this helps narrow it down.
      options:
        - "Not file-related"
        - "GPX (.gpx)"
        - "RaceBox CSV (.csv)"
        - "VESC CSV (.csv)"
        - "Generic / other GPS CSV (.csv)"
        - "RaceChrono CSV v3 (.csv)"
        - "MoTeC CSV (.csv)"
        - "AiM MyChron CSV (.csv)"
        - "Alfano CSV (.csv)"
        - "AiM XRK/XRZ (.xrk/.xrz)"
        - "MoTeC LD (.ld)"
        - "GoPro video (.mp4)"
        - "FIT (.fit)"
        - "iRacing telemetry (.ibt)"
        - "UBX (.ubx)"
        - "VBO (.vbo)"
        - "Dove (.dove)"
        - "Dovex (.dovex)"
        - "NMEA (.nmea/.txt/.csv)"
        - "Other / unsure"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser & OS
      placeholder: "Chrome 125 on Windows 11 / Safari 17 on iOS"
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample file or screenshots
      description: If possible, attach a sample file (or a snippet) and any screenshots. This issue is public, and a GPS log's first/last fixes are often your home — only attach what you're OK sharing.
    validations:
      required: false
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Anything in the browser dev console (F12 → Console)?
      render: shell
    validations:
      required: false
